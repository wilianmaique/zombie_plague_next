// Core settings. Type profiles are registered by their own plugins at precache.
anpc_capacity 24
anpc_think_interval 0.05
anpc_repath_interval 0.75
anpc_corpse_time 4.5

// Total expansions per server frame, shared fairly across four active searches.
anpc_nav_expansions 192

// Requires valid maps/<map>.nav and maps/<map>.spawns. Manual spawn is default.
anpc_auto_spawn 0

// Autonomous mapper: independent temporary fake clients during a scan.
// Scan in a quiet server session; gameplay plugins must not control these bots.
// No YaPB module, external generator or Python is needed for this mode.
anpc_scan_auto 0
// 1..8 scouts, captured at start. Reduced to free slots, keeping one for an admin.
// Each scout owns its movement, sensors and route; graph and CPU limits are shared.
// Safe ground sidesteps and peer-only collision filtering prevent team blockage.
anpc_scan_bots 1
// Green beams rotate among scouts under one shared limit; actual view/hit trace.
anpc_scan_beam 1
anpc_scan_spacing 128
// Sensor reach is up to three spacings; long walks still record intermediate nodes.
// Ordinary node spacing follows this value, with small floor samples kept separate.
// Nearby walk endpoints avoid an extra periodic node; special transitions stay precise.
// Adaptive 256/128/64/32 floor blocks retire known interiors, without adding edges.
// Unknown samples and directed path cost guide exploration before deferred returns.
// Client command: anpc_scan blocks 1 draws nearby analyzed blocks (default off).
anpc_scan_speed 300
anpc_scan_gravity 0.7
anpc_scan_max_drop 160
anpc_scan_survey 1

// Geometry and file records are processed incrementally. The CPU budget is
// cooperative; engine movement, its immediate proof, natives and commits are indivisible.
// More scouts increase player-physics cost; geometry limits stay global.
anpc_scan_traces 24
anpc_scan_budget_ms 1.0
anpc_scan_save_records 32
anpc_scan_checkpoint 60

// State for addons: anpc_scan_active. Controlled by the mapper, not this cfg.
// Optional round restart on completion. Disabled by default.
anpc_scan_restart 0
